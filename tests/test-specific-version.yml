name: Test specific Poetry version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-poetry
        uses: .
        with:
          poetry-version: "1.8.3"
      - name: Assert correct Poetry version is installed
        run: |
          echo "Checking Poetry version..."
          if ! command -v poetry &>/dev/null; then
            echo "FAIL: poetry command not found"
            exit 1
          fi
          POETRY_VERSION="$(poetry --version)"
          echo "actual: $POETRY_VERSION"
          if echo "$POETRY_VERSION" | grep -q "1.8.3"; then
            echo "PASS: Poetry 1.8.3 is installed"
          else
            echo "FAIL: expected Poetry 1.8.3 but got: $POETRY_VERSION"
            exit 1
          fi

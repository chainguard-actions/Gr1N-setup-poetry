name: Test specific Poetry version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure python and venv are available
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if ! command -v python3 >/dev/null 2>&1 || ! python3 -c "import venv, ensurepip" >/dev/null 2>&1; then
            $SUDO apt-get update -y
            $SUDO apt-get install -y python3 python3-venv python3-pip
          fi
          if ! command -v python >/dev/null 2>&1; then
            $SUDO ln -sf "$(command -v python3)" /usr/local/bin/python
          fi
          python --version
      - id: action
        uses: .
        with:
          poetry-version: "1.8.5"
      - name: Assert requested poetry version is installed
        run: |
          OUT="$(poetry --version)"
          echo "poetry --version: $OUT"
          if ! echo "$OUT" | grep -q '1\.8\.5'; then
            echo "FAIL: expected Poetry 1.8.5"
            exit 1
          fi
          echo "PASS"

name: Test specific Poetry version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-poetry
        uses: .
        with:
          poetry-version: "1.8.3"
      - name: Assert correct Poetry version is installed
        run: |
          POETRY_VERSION=$(poetry --version)
          echo "poetry version output: $POETRY_VERSION"
          if echo "$POETRY_VERSION" | grep -q "1.8.3"; then
            echo "PASS: Poetry 1.8.3 is installed"
          else
            echo "FAIL: expected Poetry 1.8.3 but got: $POETRY_VERSION"
            exit 1
          fi
      - name: Assert Poetry is functional
        run: |
          poetry env info --path 2>/dev/null || true
          poetry --version
          echo "PASS: Poetry is functional"

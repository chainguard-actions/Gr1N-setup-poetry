name: Test basic usage - install latest stable Poetry
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-poetry
        uses: .
      - name: Assert Poetry is installed and accessible
        run: |
          echo "Checking poetry is on PATH..."
          which poetry || { echo "FAIL: poetry not found on PATH"; exit 1; }
          POETRY_VERSION=$(poetry --version)
          echo "poetry version: $POETRY_VERSION"
          if [ -z "$POETRY_VERSION" ]; then
            echo "FAIL: poetry --version returned empty"
            exit 1
          fi
          echo "PASS: Poetry is installed: $POETRY_VERSION"
      - name: Assert Poetry can run basic commands
        run: |
          poetry --help > /dev/null 2>&1 || { echo "FAIL: poetry --help failed"; exit 1; }
          echo "PASS: poetry --help succeeded"

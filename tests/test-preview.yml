name: Test Poetry preview (prerelease) installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-poetry
        uses: .
        with:
          poetry-preview: "true"
      - name: Assert Poetry is installed (preview mode)
        run: |
          echo "Checking Poetry installation in preview mode..."
          if ! command -v poetry &>/dev/null; then
            echo "FAIL: poetry command not found"
            exit 1
          fi
          POETRY_VERSION="$(poetry --version)"
          echo "actual: $POETRY_VERSION"
          if [ -z "$POETRY_VERSION" ]; then
            echo "FAIL: poetry --version returned empty"
            exit 1
          fi
          echo "PASS: Poetry is installed in preview mode: $POETRY_VERSION"
